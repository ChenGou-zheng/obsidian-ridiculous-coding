name: Release Obsidian Plugin

on:
  push:
    tags:
      - "*"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: "18"

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Create release package
        run: |
          mkdir release
          cp main.js manifest.json styles.css release/
          cp -r media release/

      - name: Create Release
        id: create_release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            release/main.js
            release/manifest.json
            release/styles.css
            release/media/blip.svg
            release/media/boom.svg
            release/media/newline.svg
            release/media/font/GravityBold8.ttf
            release/media/sound/blip.wav
            release/media/sound/boom.wav
            release/media/sound/fireworks.wav
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
