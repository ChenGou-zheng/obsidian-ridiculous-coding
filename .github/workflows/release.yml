name: Release Obsidian Plugin

on:
  push:
    tags:
      - "*"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Verify version consistency
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          MANIFEST_VERSION=$(node -p "require('./manifest.json').version")
          if [ "$TAG_VERSION" != "$MANIFEST_VERSION" ]; then
            echo "❌ Tag version ($TAG_VERSION) does not match manifest.json ($MANIFEST_VERSION)"
            exit 1
          fi
          echo "✅ Tag v$TAG_VERSION matches manifest.json"

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Create release package
        run: |
          mkdir -p release
          cp main.js manifest.json styles.css release/
          cp -r media release/

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/main.js
            release/manifest.json
            release/styles.css
            release/media/blip.svg
            release/media/boom.svg
            release/media/newline.svg
            release/media/font/GravityBold8.ttf
            release/media/sound/blip.wav
            release/media/sound/boom.wav
            release/media/sound/fireworks.wav
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
