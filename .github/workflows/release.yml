name: Release Obsidian Plugin

on:
  push:
    tags:
      - "*"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Sync version from tag
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          echo "Tag version: $TAG_VERSION"
          # Sync manifest.json version
          node -e "
            const m = require('./manifest.json');
            m.version = '$TAG_VERSION';
            require('fs').writeFileSync('./manifest.json', JSON.stringify(m, null, '\t') + '\n');
          "
          # Sync versions.json
          node -e "
            const v = require('./versions.json');
            const minApp = require('./manifest.json').minAppVersion;
            v['$TAG_VERSION'] = minApp;
            require('fs').writeFileSync('./versions.json', JSON.stringify(v, null, '\t') + '\n');
          "
          echo "✅ Synced manifest.json + versions.json to v$TAG_VERSION"

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Create release package
        run: |
          mkdir -p release
          cp main.js manifest.json styles.css release/
          cp -r media release/

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/main.js
            release/manifest.json
            release/styles.css
            release/media/blip.svg
            release/media/boom.svg
            release/media/newline.svg
            release/media/font/GravityBold8.ttf
            release/media/sound/blip.wav
            release/media/sound/boom.wav
            release/media/sound/fireworks.wav
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
